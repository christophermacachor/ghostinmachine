app = "omega-swarm-macos"
primary_region = "iad"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # CRITICAL: keeps background thread alive
  auto_start_machines = true
  min_machines_running = 1    # CRITICAL: always 1 machine running

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
